# Copiloto Medico de Insights — site estatico na Oracle Cloud
# /        -> app do medico (index.html)
# /gestao/ -> dashboard da gestao (gestao/index.html)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/copiloto;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # fontes auto-hospedadas mudam raramente
    location /styles/fontes/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
