<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Shots</title>
  <style>
    body { margin: 0; padding: 16px; background: #E9ECE9; }
    iframe { width: 1380px; height: 2240px; border: 1px solid #D7DDD8; display: block; }
  </style>
</head>
<body>
  <h1 style="font: 600 16px system-ui; margin: 8px 0 12px;">Captura de telas</h1>
  <iframe id="app"></iframe>

  <script>
    /* Harness de captura: ?hash=analise|dashboard|retorno, ?analisar=1,
       ?scroll=<id do elemento>|bloqueado, ?tema=claro|escuro (padrão claro,
       porque o Chrome headless nasce no modo escuro) e ?app=gestao para
       capturar a aplicação de gestão (que é uma página própria). */
    var p = new URLSearchParams(location.search);
    var frame = document.getElementById("app");
    var ehGestao = p.get("app") === "gestao";
    frame.src = (ehGestao ? "../gestao/index.html" : "../index.html") + "?sem-estado=1" +
      (p.get("hash") && !ehGestao ? "#" + p.get("hash") : "");

    var aviso = document.createElement("p");
    aviso.style.font = "13px system-ui";
    aviso.textContent = "SHOTS PENDENTE";
    document.body.insertBefore(aviso, document.body.firstChild);
    function marcar(t) { document.title = t; aviso.textContent = t; }

    var tentativas = 0;
    var feito = false;
    function tentar() {
      tentativas++;
      if (feito) return;
      var fd = null;
      try { fd = frame.contentDocument; } catch (e0) { fd = null; }
      var nome = fd ? fd.getElementById("ctx-nome") : null;
      var pronto;
      if (ehGestao) {
        pronto = !!fd && fd.readyState === "complete";
      } else {
        pronto = !!nome && nome.textContent !== "Carregando";
      }
      if (!pronto) {
        if (tentativas >= 100) {
          feito = true;
          marcar("SHOTS FAIL app não inicializou");
          return;
        }
        marcar("SHOTS PENDENTE " + tentativas);
        if (!fd || tentativas % 10 === 0) {
          try { frame.src = frame.src; } catch (e1) {}
        }
        setTimeout(tentar, 100);
        return;
      }
      feito = true;
      try {
        var temaDesejado = p.get("tema") === "escuro" ? "escuro" : "claro";
        var btnTema = fd.getElementById("btn-tema");
        if (btnTema && fd.documentElement.getAttribute("data-tema") !== temaDesejado) {
          btnTema.click();
        }
        var btnAnalisar = fd.getElementById("btn-analisar");
        if (p.get("analisar") === "1" && btnAnalisar) {
          btnAnalisar.click();
        }
        var alvo = p.get("scroll");
        if (alvo === "bloqueado") {
          var b = fd.querySelector(".insight--bloqueado");
          if (b) b.scrollIntoView();
        } else if (alvo) {
          var el = fd.getElementById(alvo);
          if (el) el.scrollIntoView();
        }
        marcar("SHOTS OK");
      } catch (e) {
        marcar("SHOTS FAIL " + e);
      }
    }

    frame.addEventListener("load", function () { tentar(); });
  </script>
</body>
</html>
